<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <title>DOM Nodes Example</title>
</head>
<body>

    <h1>Hello World</h1>
    <!-- This is a comment -->

    <script>
        //Document Node
        console.log("--- Document Node ---");
        console.log("document.nodeType:", document.nodeType); 
        // Output: 9 (DOCUMENT_NODE)

        //Element Node (h1)
        console.log("\n--- Element Node ---");
        const heading = document.querySelector("h1");
        console.log("heading.nodeType:", heading.nodeType); 
        // Output: 1 = Element Node

        //Text Node (Hello World)
        console.log("\n--- Text Node ---");
        console.log("heading.firstChild.nodeType:", heading.firstChild.nodeType); 
        // Output: 3 = Text Node
        console.log("Text value:", heading.firstChild.nodeValue); 
        // Output: "Hello World"

        //Comment Node
        console.log("\n--- Comment Node ---");
        // Comment node is found by using NodeIterator
        const commentIterator = document.createNodeIterator(document.body, NodeFilter.SHOW_COMMENT);
        const commentNode = commentIterator.nextNode();
        
        if (commentNode) {
            console.log("commentNode.nodeType:", commentNode.nodeType); 
            // Output: 8 = Comment Node
            console.log("Comment text:", commentNode.nodeValue); 
            // Output: " This is a comment "
        }
    </script>

</body>
</html>
