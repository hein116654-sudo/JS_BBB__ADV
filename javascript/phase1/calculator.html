<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Week 4 Mini Project - Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }
    body {
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .calculator {
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      width: 340px;
    }
    h2 {
      text-align: center;
      margin-top: 0;
      color: #333;
    }
    .input-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 14px;
      margin-bottom: 5px;
      color: #555;
    }
    input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    input:focus {
      outline: none;
      border-color: #4a90e2;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 15px;
    }
    button {
      padding: 12px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background-color: #4a90e2;
      color: white;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #357abd;
    }
    .clear-btn {
      width: 100%;
      margin-top: 10px;
      background-color: #e74c3c;
      font-size: 16px;
    }
    .clear-btn:hover {
      background-color: #c0392b;
    }
    .output-box {
      margin-top: 18px;
      padding: 12px;
      border-radius: 6px;
      background-color: #f8f9fa;
      border: 1px solid #e1e4e8;
      min-height: 48px;
      text-align: center;
    }
    #result {
      font-size: 18px;
      font-weight: bold;
      color: #2c3e50;
      margin: 0;
    }
    #error {
      font-size: 14px;
      color: #e74c3c;
      margin: 4px 0 0;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="calculator">
    <h2>JS Calculator</h2>

    <div class="input-group">
      <label for="num1">First Number</label>
      <input type="text" id="num1" placeholder="Enter first number" />
    </div>

    <div class="input-group">
      <label for="num2">Second Number</label>
      <input type="text" id="num2" placeholder="Enter second number" />
    </div>

    <div class="buttons">
      <button onclick="handleCalculate('+')">+</button>
      <button onclick="handleCalculate('-')">-</button>
      <button onclick="handleCalculate('*')">×</button>
      <button onclick="handleCalculate('/')">÷</button>
    </div>

    <button class="clear-btn" onclick="clearCalculator()">Clear</button>

    <div class="output-box">
      <p id="result">Result: -</p>
      <p id="error"></p>
    </div>
  </div>

  <script src="calculator.js"></script>
</body>
</html>
