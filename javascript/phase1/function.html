<!DOCTYPE html>
<html>
    <head>
        <title>Function Declaration</title>
    </head>
    <body>
        <script>
            //function declaration(no parameters)
            function greet() {
                console.log("Mingalaba! Welcome to JavaScript World.");
            }

            //calling function
            greet();
            greet();

            function greetUser(name) {
                console.log(`Hello, ${name}! Nice to meet you.`);
            }

            greetUser("Aung Aung");
            greetUser("Su Su");

            sayGoodbye("Mg Mg");

            function sayGoodbye(user) {
                console.log(`Goodbbye, ${user}. See you next time!`);
            }
        </script>
    </body>
</html>
