<!DOCTYPE html>
<html>
    <head>
        <title>JavaScript Introduction, Console, DevTools</title>
    </head>
    <body>
        <script>
            console.log("Hello, World!");
            console.log("Welcome to Week 2: JavaScript Basics");
            console.log("Name:", "Aung Aung", "| Age:", 22);

            console.info("Info: Script started successfully.");
            console.warn("Warning: This is a warning message.");
            console.error("Error: Something went wrong!");

            console.table(["Apple", "Banana", "Cherry"]);

            console.table([
                { name: "Mg Mg", role: "Frontend" },
                { name: "Su Su", role: "Backend" }
            ]);

            console.group("User Details");
            console.log("Username: coder_mm");
            console.log("Status: Active");
            console.groupEnd();

            function testDebug() {
                let x = 10;
                debugger; //execution will pause here if devtools is open
                let y = x + 5;
                console.log(y);
            }
            // testDebug();
        </script>
    </body>
</html>
