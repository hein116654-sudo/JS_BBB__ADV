<!DOCTYPE html>
<html>
    <head>
        <title></title>
    </head>
    <body>
        <script>

            //Basic 'if' statement
            let temperature = 36;
            if (temperature > 30) {
            console.log("It is a hot day! Drink plenty of water.");
            }

            //'if ... else' statement (Two outcomes)
            let password = "123";
            if (password.length >= 6) {
            console.log("Password is valid.");
            } else {
            console.log("Validation Error: Password must be at least 6 characters.");
            }

            //'if ... else if ... else' (Multiple conditions + Validation)
            let examScore = 82;

            if (examScore < 0 || examScore > 100) {
            console.log("Invalid score! Please enter a number between 0 and 100.");
            } else if (examScore >= 80) {
            console.log("Grade: A (Distinction)");
            } else if (examScore >= 60) {
            console.log("Grade: B (Credit)");
            } else if (examScore >= 40) {
            console.log("Grade: C (Pass)");
            } else {
            console.log("Grade: F (Fail)");
            }

            //Nested 'if' (An if inside another if)
            let hasTicket = true;
            let age = 15;

            if (hasTicket) {
            console.log("Ticket verified.");
            if (age >= 18) {
                console.log("Welcome to the 18+ Movie Hall.");
            } else {
                console.log("Sorry, you are under 18. You can enter the Family Hall instead.");
            }
            } else {
            console.log("Access Denied: Please buy a ticket first.");
            }
        </script>
    </body>
</html>
