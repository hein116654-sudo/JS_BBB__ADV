<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Day 7 Mini Project - Interactive To-Do List</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body {
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      padding: 40px 15px;
      margin: 0;
    }
    .app-container {
      background: #fff;
      width: 100%;
      max-width: 500px;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
    }
    h1 { text-align: center; margin-top: 0; color: #2c3e50; font-size: 24px; }

    /* Add Task Form */
    .todo-form { display: flex; gap: 8px; margin-bottom: 6px; }
    .todo-form input {
      flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px;
    }
    .todo-form button {
      padding: 10px 18px; background: #2ecc71; color: white; border: none;
      border-radius: 6px; font-weight: bold; cursor: pointer;
    }
    .todo-form button:hover { background: #27ae60; }
    .error-msg { color: #e74c3c; font-size: 13px; margin: 0 0 12px; min-height: 18px; }

    /* Search & Filter Controls */
    .controls { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
    #searchInput {
      width: 100%; padding: 9px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px;
    }
    .filter-buttons { display: flex; gap: 8px; }
    .filter-btn {
      flex: 1; padding: 8px; border: 1px solid #ddd; background: #f8f9fa;
      border-radius: 6px; cursor: pointer; font-weight: bold; color: #555;
    }
    .filter-btn.active {
      background: #3498db; color: white; border-color: #3498db;
    }

    /* Task List */
    #taskList { list-style: none; padding: 0; margin: 0; }
    .task-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px; border: 1px solid #eee; border-radius: 8px;
      margin-bottom: 8px; background: #fafafa; gap: 10px;
    }
    .task-left { display: flex; align-items: center; gap: 10px; flex: 1; }
    .task-checkbox { width: 18px; height: 18px; cursor: pointer; }
    .task-text { font-size: 15px; color: #333; word-break: break-word; }
    .task-item.completed .task-text {
      text-decoration: line-through; color: #95a5a6;
    }
    .edit-input {
      flex: 1; padding: 6px 8px; font-size: 14px; border: 1px solid #3498db; border-radius: 4px;
    }

    /* Action Buttons */
    .task-actions { display: flex; gap: 6px; }
    .btn-sm {
      padding: 5px 10px; font-size: 12px; border: none; border-radius: 4px;
      cursor: pointer; color: white; font-weight: bold;
    }
    .btn-edit { background: #f39c12; }
    .btn-delete { background: #e74c3c; }
    .btn-save { background: #2ecc71; }
    .btn-cancel { background: #7f8c8d; }
    .empty-msg { text-align: center; color: #888; padding: 20px 0; font-style: italic; }

    /* Footer Stats */
    .stats {
      margin-top: 15px; font-size: 13px; color: #666;
      display: flex; justify-content: space-between; border-top: 1px solid #eee; padding-top: 12px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <h1>Interactive To-Do List</h1>

    <!-- Add Task -->
    <form id="todoForm" class="todo-form">
      <input type="text" id="taskInput" placeholder="Add a new task..." />
      <button type="submit">Add</button>
    </form>
    <p id="errorMsg" class="error-msg"></p>

    <!-- Search & Filter -->
    <div class="controls">
      <input type="text" id="searchInput" placeholder="Search tasks..." />
      <div class="filter-buttons" id="filterContainer">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>
    </div>

    <!-- Task List -->
    <ul id="taskList"></ul>

    <!-- Summary Stats -->
    <div class="stats">
      <span id="totalCount">Total: 0</span>
      <span id="remainingCount">Remaining: 0</span>
    </div>
  </div>

  <script src="todo.js"></script>
</body>
</html>
