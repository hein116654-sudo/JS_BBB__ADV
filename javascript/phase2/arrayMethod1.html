<!DOCTYPE html>
<html>
    <head>
        <title></title>
    </head>
    <body>
        <script>
            const colors = ["Red", "Green", "Blue", "Yellow", "Purple"];

            // 1. includes() -> Checks if an item exists (returns true/false)
            console.log("Has 'Blue'?:", colors.includes("Blue"));   // true
            console.log("Has 'Black'?:", colors.includes("Black")); // false

            // 2. indexOf() -> Finds the index of an item (returns -1 if not found)
            console.log("Index of 'Yellow':", colors.indexOf("Yellow")); // 3
            console.log("Index of 'Pink':", colors.indexOf("Pink"));     // -1

            // 3. slice(start, end) -> Copies a portion WITHOUT changing original array
            // Note: 'end' index is NOT included!
            const slicedColors = colors.slice(1, 4); // Index 1, 2, 3
            console.log("Sliced (1 to 4):", slicedColors); // ["Green", "Blue", "Yellow"]
            console.log("Original colors (unchanged):", colors);

            // 4. splice(start, deleteCount, ...itemsToAdd) -> MUTATES (changes) original array!
            let items = ["Pen", "Book", "Eraser", "Ruler"];

            // Remove 1 item at index 2 ("Eraser")
            let removed = items.splice(2, 1);
            console.log("Removed:", removed, "| Items now:", items);

            // Insert "Pencil" at index 1 without deleting anything (deleteCount = 0)
            items.splice(1, 0, "Pencil");
            console.log("After insert:", items);

            // Replace 1 item at index 0 ("Pen" -> "Marker")
            items.splice(0, 1, "Marker");
            console.log("After replace:", items);           
        </script>
    </body>
</html>
