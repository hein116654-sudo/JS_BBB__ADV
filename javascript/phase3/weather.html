<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Application</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .weather-app {
      background: rgba(255, 255, 255, 0.95);
      width: 100%;
      max-width: 440px;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
    }
    h1 {
      text-align: center;
      margin: 0 0 18px;
      font-size: 24px;
      color: #2c3e50;
    }

    /* Search Form */
    .search-form {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }
    .search-form input {
      flex: 1;
      padding: 11px 14px;
      font-size: 15px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
    }
    .search-form input:focus { border-color: #0284c7; }
    .search-form button {
      padding: 11px 18px;
      font-size: 15px;
      font-weight: bold;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .search-form button:hover:not(:disabled) { background: #0369a1; }
    .search-form button:disabled { background: #94a3b8; cursor: not-allowed; }

    /* Loading & Error States */
    .hidden { display: none !important; }
    .loading {
      text-align: center;
      padding: 20px;
      color: #0284c7;
      font-weight: bold;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 4px solid #e2e8f0;
      border-top-color: #0284c7;
      border-radius: 50%;
      margin: 0 auto 8px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-box {
      background: #fee2e2;
      color: #b91c1c;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
      margin-bottom: 15px;
    }

    /* Weather Display Card */
    .weather-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      margin-bottom: 18px;
    }
    .city-name { font-size: 20px; font-weight: bold; color: #1e293b; margin: 0; }
    .weather-icon { font-size: 48px; margin: 10px 0 4px; }
    .temperature { font-size: 42px; font-weight: bold; color: #0f172a; margin: 0; }
    .condition { font-size: 15px; color: #475569; margin: 4px 0 16px; }

    .weather-details {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      border-top: 1px solid #e2e8f0;
      padding-top: 14px;
    }
    .detail-item span { display: block; font-size: 12px; color: #64748b; }
    .detail-item strong { font-size: 15px; color: #1e293b; }

    /* Recent Searches */
    .recent-section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .recent-section-header h3 { font-size: 14px; color: #475569; margin: 0; }
    .clear-history-btn {
      background: none; border: none; color: #ef4444;
      font-size: 12px; cursor: pointer; padding: 0;
    }
    .recent-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .recent-chip {
      background: #e0f2fe;
      color: #0369a1;
      border: none;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
    }
    .recent-chip:hover { background: #bae6fd; }

    /* Responsive Design for Mobile */
    @media (max-width: 480px) {
      .weather-app { padding: 18px; }
      .search-form { flex-direction: column; }
      .weather-details { grid-template-columns: 1fr; gap: 8px; }
      .temperature { font-size: 36px; }
    }
  </style>
</head>
<body>

  <div class="weather-app">
    <h1>🌤️ Weather App</h1>

    <!-- Search City Form -->
    <form id="searchForm" class="search-form">
      <input type="text" id="cityInput" placeholder="Enter city (e.g., Yangon, Berlin, Tokyo)..." />
      <button type="submit" id="searchBtn">Search</button>
    </form>

    <!-- Error State -->
    <div id="errorBox" class="error-box hidden"></div>

    <!-- Loading State -->
    <div id="loadingBox" class="loading hidden">
      <div class="spinner"></div>
      Fetching weather data...
    </div>

    <!-- Weather Result Card -->
    <div id="weatherCard" class="weather-card hidden">
      <h2 id="cityName" class="city-name">-</h2>
      <div id="weatherIcon" class="weather-icon">☀️</div>
      <p id="temperature" class="temperature">--°C</p>
      <p id="condition" class="condition">-</p>

      <div class="weather-details">
        <div class="detail-item">
          <span>Feels Like</span>
          <strong id="feelsLike">--°C</strong>
        </div>
        <div class="detail-item">
          <span>Humidity</span>
          <strong id="humidity">--%</strong>
        </div>
        <div class="detail-item">
          <span>Wind Speed</span>
          <strong id="windSpeed">-- km/h</strong>
        </div>
      </div>
    </div>

    <!-- Recent Searches (Saved in localStorage) -->
    <div id="recentSection" class="hidden">
      <div class="recent-section-header">
        <h3>Recent Searches</h3>
        <button id="clearHistoryBtn" class="clear-history-btn">Clear</button>
      </div>
      <div id="recentList" class="recent-list"></div>
    </div>
  </div>

  <script src="weather.js"></script>
</body>
</html>
