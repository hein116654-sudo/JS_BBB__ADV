<!DOCTYPE html>
<html>
    <head>
        <title>Calculator</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <div class="calBody">
            <div class="screen">
                <p id="history"></p>
                <p id="result"></p>
            </div>
            <div class="mainbtn">
                <button class="topbtn" >AC</button>
                <button class="topbtn">DEL</button>
                <button class="topbtn">&#37;</button>
                <button class="operator">&divide</button>
            </div>
            <div class="mainbtn">
                <button class="btn">7</button>
                <button class="btn">8</button>
                <button class="btn">9</button>
                <button class="operator">&times;</button>
            </div>
            <div class="mainbtn">
                <button class="btn">4</button>
                <button class="btn">5</button>
                <button class="btn">6</button>
                <button class="operator">&minus;</button>
            </div>
            <div class="mainbtn">
                <button class="btn">1</button>
                <button class="btn">2</button>
                <button class="btn">3</button>
                <button class="operator">&plus;</button>
            </div>
            <div class="mainbtn">
                <button class="btnzero">0</button>
                <button class="btn">.</button>
                <button class="equal">&equals;</button>
            </div>
        </div>

        <script src="js/calculation.js"></script>
    </body>
</html>
